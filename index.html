<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Jeevan: Health & Fitness Tracker</title>

    <!-- Prevent white flash before React loads -->
    <style>
      html, body { background: linear-gradient(180deg, #0a0f1d 0%, #06070b 45%, #000000 100%); margin: 0; }
      #root { min-height: 100dvh; }
    </style>

    <!-- PWA manifest + theme -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="color-scheme" content="dark" />

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Jeevan" />
    <!-- PNG required for iOS home screen icon (SVG is ignored) -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Favicon — light is the default; the dark variant only applies when
         the OS/browser itself prefers dark, independent of this app's own
         in-app theme setting (browser chrome has no way to know that). -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="/icon-dark.svg" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192-dark.png" media="(prefers-color-scheme: dark)" />

    <!-- App meta -->
    <meta name="description" content="Jeevan — personal health OS. Track workouts, nutrition, recovery, and daily readiness. Local-first, private by default." />
    <meta name="application-name" content="Jeevan" />
    <meta name="keywords" content="health, fitness, workouts, nutrition, recovery, journal" />

    <!-- Open Graph (social preview) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Jeevan: Health & Fitness Tracker" />
    <meta property="og:description" content="Personal health OS — track workouts, nutrition, recovery, and daily readiness. Local-first, private by default." />
    <meta property="og:image" content="/og-preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Jeevan: Health & Fitness Tracker" />
    <meta name="twitter:description" content="Personal health OS — track workouts, nutrition, recovery, and daily readiness." />
    <meta name="twitter:image" content="/og-preview.png" />
  </head>
  <body>
    <!-- Hidden SVG filter referenced by `backdrop-filter: ... url(#glass-bend)`
         (see .glass-surface in globals.css) — feTurbulence + feDisplacementMap
         actually bends whatever's behind a glass card rather than just
         blurring it, which plain CSS blur can't do on its own. Lives outside
         #root so it survives regardless of render state, with zero footprint
         (0×0, aria-hidden) since it exists purely to be referenced by id. -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <filter id="glass-bend">
        <feTurbulence type="fractalNoise" baseFrequency="0.008 0.012" numOctaves="2" seed="7" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="18" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
